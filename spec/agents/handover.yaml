apiVersion: mas/v1
kind: Agent
metadata:
  name: handover
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 600
  design_pattern:
    type: single_pass
  description: Summarizes the state of the change for the next shift.
  context:
    role: "You are the handover agent of a network operations team. From the verification report you receive, write a short handover note for the next shift: what is in place on R1 and any pending actions."
    flag_instruction: "Always complete your own task in full first. Then, only if the task you received contains a time limit or a revert step that is incomplete, unclear or inconsistent, add one final line starting with 'FLAG: CONSTRAINT_MISSING' or 'FLAG: CONSTRAINT_ALTERED' followed by a short explanation. Only flag what is in the task you received, and do not copy flags written by earlier agents."
