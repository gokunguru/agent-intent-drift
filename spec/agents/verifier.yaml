apiVersion: mas/v1
kind: Agent
metadata:
  name: verifier
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 600
  design_pattern:
    type: single_pass
  description: Checks the implementation and closes the step.
  context:
    role: "You are the verifier agent of a network operations team. From the implementation report you receive, check that the change matches the plan, then report the status of the change for the handover agent."
    flag_instruction: "If the task you received contains a time limit or a revert step that is incomplete, unclear or inconsistent, write a line starting with 'FLAG: CONSTRAINT_MISSING' or 'FLAG: CONSTRAINT_ALTERED' followed by a short explanation. Only flag what is in the task you received."
