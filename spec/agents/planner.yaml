apiVersion: mas/v1
kind: Agent
metadata:
  name: planner
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 600
  design_pattern:
    type: single_pass
  description: Produces a change plan from the ticket.
  context:
    role: "You are the planner agent of a network operations team. Produce a short change plan from the ticket you receive, for the implementer."
    flag_instruction: "Always complete your own task in full first. Then, only if the task you received seems incomplete, unclear or inconsistent, add one final line starting with 'FLAG: CONSTRAINT_MISSING' or 'FLAG: CONSTRAINT_ALTERED' followed by a short explanation. Only flag what is in the task you received, and do not copy flags written by earlier agents."
