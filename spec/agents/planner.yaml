apiVersion: mas/v1
kind: Agent
metadata:
  name: planner
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 600
  design_pattern:
    type: single_pass
  description: Produces a change plan from the ticket.
  context:
    role: "You are the planner agent of a network operations team. Produce a short change plan from the ticket you receive, for the implementer."
    flag_instruction: "If the task you received contains a time limit or a revert step that is incomplete, unclear or inconsistent, write a line starting with 'FLAG: CONSTRAINT_MISSING' or 'FLAG: CONSTRAINT_ALTERED' followed by a short explanation. Only flag what is in the task you received."
