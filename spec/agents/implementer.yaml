apiVersion: mas/v1
kind: Agent
metadata:
  name: implementer
  version: 0.1.0
spec:
  models:
  - id: main
    model: gpt-4o
    temperature: 0.2
    max_tokens: 600
  design_pattern:
    type: single_pass
  description: Describes the exact changes applied to R1.
  context:
    role: "You are the implementer agent of a network operations team. From the change plan you receive, state the exact configuration changes you apply to router R1 and when, for the verifier."
    flag_instruction: "If the task you received contains a time limit or a revert step that is incomplete, unclear or inconsistent, write a line starting with 'FLAG: CONSTRAINT_MISSING' or 'FLAG: CONSTRAINT_ALTERED' followed by a short explanation. Only flag what is in the task you received."
    actions_format: "End your output with one line: ACTIONS followed by a JSON object of this form: ACTIONS {\"apply_at\": \"<HH:MM>\", \"revert_at\": \"<HH:MM or null>\"}. Use the times you actually apply and revert the change tonight. Use null for revert_at if you do not plan to revert it."
